<html>
    <head>
        <title>3_1</title>
        <!--
            <link rel="stylesheet" href="/static/index.css" />
        -->
    </head>
    <body>
        <form id="search">
            Country: <input name="country" type="text" /> <br/>
            <input type="submit" />
        </form>
        <template id="countryTemplate">
            <tr>
                <td><!--name--></td>
                <td><!--capital--></td> 
                <td><!--population--></td>
                <td><!--region--></td>
                <td><!--subregion--></td>
            </tr>
        </template>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Capital</th>
                    <th>Population</th>
                    <th>Region</th>
                    <th>Subregion</th>
                </tr>
            </thead>
            <tbody id="countries" />
        </table>
    </body>
    <script src="/index.js"></script>
</html>
